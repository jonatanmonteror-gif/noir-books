name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Preparar APK y huella SHA-256
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk NoirBooks.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab NoirBooks-play.aab
          sha256sum NoirBooks.apk | cut -d' ' -f1 > NoirBooks.apk.sha256
          echo "SHA-256: $(cat NoirBooks.apk.sha256)"

      - name: Publicar versión
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Noir Books 1.0.${{ github.run_number }}
          body: |
            Huella SHA-256 del APK publicada en NoirBooks.apk.sha256.
          files: |
            NoirBooks.apk
            NoirBooks.apk.sha256
            NoirBooks-play.aab
          make_latest: true
